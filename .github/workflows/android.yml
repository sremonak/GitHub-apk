name: Build Android APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check runner Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Test, lint and assemble installable APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Annotate build failures
        if: failure()
        shell: python
        run: |
          import os, pathlib
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-build.log'
          if log.exists():
              message = log.read_text()[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android build failed::' + message)
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OctoHub-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OctoHub-Android-APK
          path: OctoHub-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
