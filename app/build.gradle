plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.octohub.android'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.octohub.android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release APKs must be signed with your own private keystore.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
